<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Installare Claude Code — slide</title>
<style>
:root{
  --cemento:#EEF0EE; --carta:#FFFFFF; --grafite:#24282C; --acciaio:#6F787F; --filetto:#CDD3D3; --rosso:#C8102E;
  --titolo:"Avenir Next Condensed","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --testo:"Avenir Next","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1A1D20;overflow:hidden}
body{font-family:var(--testo);color:var(--grafite);-webkit-font-smoothing:antialiased}
#palco{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center}
.slide{position:absolute;inset:0;background:var(--cemento);padding:80px 110px 110px;display:none;flex-direction:column}
.slide.attiva{display:flex}
h1,h2,h3{font-family:var(--titolo);font-weight:700;letter-spacing:-.01em;line-height:1.02}
h1{font-size:140px}
h2{font-size:76px;margin-bottom:14px}
h3{font-size:40px;margin-bottom:18px}
.kicker{font-family:var(--titolo);font-size:28px;font-weight:600;color:var(--rosso);margin-bottom:10px}
.ob{font-size:30px;color:var(--acciaio);margin-bottom:36px;max-width:1300px}
.copertina{justify-content:flex-end;padding-bottom:150px}
.copertina .sotto{font-family:var(--titolo);font-size:50px;font-weight:500;margin-top:24px;max-width:1300px}
.copertina .chi{margin-top:48px;font-size:26px;color:var(--acciaio)}
.due{display:grid;grid-template-columns:1fr 1fr;gap:56px;flex:1}
.col{background:var(--carta);border-top:8px solid var(--grafite);padding:26px 30px;overflow:hidden}
.passi{list-style:none;display:flex;flex-direction:column;gap:14px}
.passi li{font-size:25px;line-height:1.3}
.passi code,.err code{display:block;font-family:var(--mono);font-size:19px;color:var(--acciaio);margin-top:4px;word-break:break-all}
.err code{display:inline;color:var(--grafite)}
.lab{font-family:var(--titolo);font-size:22px;font-weight:600;color:var(--rosso);margin:22px 0 8px;text-transform:uppercase;letter-spacing:.05em}
.err{list-style:none;display:flex;flex-direction:column;gap:12px}
.err li{font-size:22px;line-height:1.3;padding-left:26px;position:relative}
.err li::before{content:"";position:absolute;left:0;top:.55em;width:12px;height:4px;background:var(--rosso)}
.due .err li{font-size:26px}
.grande{font-size:38px;line-height:1.4;padding-left:50px;display:flex;flex-direction:column;gap:22px;max-width:1300px}
ul.grande{list-style:none;padding-left:0}
ul.grande li{padding-left:40px;position:relative}
ul.grande li::before{content:"";position:absolute;left:0;top:.62em;width:18px;height:5px;background:var(--grafite)}
blockquote{background:var(--carta);border-left:10px solid var(--rosso);padding:30px 36px;font-size:29px;line-height:1.45;max-width:1380px}
.piede{position:absolute;left:110px;right:110px;bottom:40px;display:flex;justify-content:space-between;font-size:22px;color:var(--acciaio)}
@media print{
  @page{size:1600px 900px;margin:0}
  html,body{overflow:visible;height:auto;background:none}
  #palco{position:static;transform:none!important}
  .slide{display:flex!important;position:relative;width:1600px;height:900px;break-after:page}
}
</style>
</head>
<body>
<div id="palco">
<!--SLIDES-->
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var palco = document.getElementById('palco');
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var n = slides.length;
  slides.forEach(function (s, i) {
    var piede = document.createElement('div');
    piede.className = 'piede';
    piede.innerHTML = '<span>Installare Claude Code · agenti MAK</span><span>' + (i + 1) + ' / ' + n + '</span>';
    s.appendChild(piede);
  });
  var cur = Math.min(Math.max(parseInt(location.hash.slice(1), 10) || 1, 1), n) - 1;
  function mostra(i) {
    cur = Math.min(Math.max(i, 0), n - 1);
    slides.forEach(function (s, k) { s.classList.toggle('attiva', k === cur); });
    history.replaceState(null, '', '#' + (cur + 1));
  }
  function adatta() {
    var sc = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    palco.style.transform = 'translate(-50%,-50%) scale(' + sc + ')';
  }
  document.addEventListener('keydown', function (e) {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].indexOf(e.key) > -1) { e.preventDefault(); mostra(cur + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].indexOf(e.key) > -1) { e.preventDefault(); mostra(cur - 1); }
    else if (e.key === 'Home') mostra(0);
    else if (e.key === 'End') mostra(n - 1);
    else if (e.key === 'f' || e.key === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    }
  });
  document.addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    if (e.clientX < window.innerWidth / 4) mostra(cur - 1); else mostra(cur + 1);
  });
  window.addEventListener('resize', adatta);
  adatta();
  mostra(cur);
});
</script>
</body>
</html>
